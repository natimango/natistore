version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: natistore-postgres
    environment:
      POSTGRES_DB: natistore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - natistore-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: natistore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - natistore-network

  # Medusa Backend
  medusa-backend:
    build:
      context: ./packages/medusa-backend
      dockerfile: Dockerfile
    container_name: natistore-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/natistore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret
      COOKIE_SECRET: your-cookie-secret
      NODE_ENV: development
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./packages/medusa-backend:/app
      - /app/node_modules
    networks:
      - natistore-network

  # Storefront
  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: natistore-storefront
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://medusa-backend:9000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - medusa-backend
    volumes:
      - ./apps/storefront:/app
      - /app/node_modules
    networks:
      - natistore-network

  # Admin Dashboard
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: natistore-admin
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://medusa-backend:9000
      NODE_ENV: development
    ports:
      - "7001:7001"
    depends_on:
      - medusa-backend
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    networks:
      - natistore-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: natistore-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - storefront
      - admin
      - medusa-backend
    networks:
      - natistore-network

volumes:
  postgres_data:
  redis_data:

networks:
  natistore-network:
    driver: bridge 